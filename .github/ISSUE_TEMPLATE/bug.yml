name: Bug
description: Something that doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Platform (iOS, Android, web phone or desktop width), role, and venue if it matters. No emails or personal data; this repo is public.
    validations:
      required: true
  - type: input
    id: sentry
    attributes:
      label: Sentry issue link (if any)
