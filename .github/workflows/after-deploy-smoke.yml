# After each production deploy, check that babyvom.it actually works in a
# browser (smoke/smoke.mjs): the pages carry the app's scripts and they load,
# the app starts signed out, a public drink page shows data from Supabase, and
# nothing logs an error, at phone and desktop widths. On 22 Oct 2026 the site
# served pages with no JavaScript for about three hours and nobody noticed.
#
# Signed out and read-only, no secrets. A failure fails the run and opens (or
# comments on) an issue, since a run triggered by Vercel's deployment event
# emails nobody. The issue closes itself on the next pass.
name: After-deploy smoke

on:
  # Vercel reports each deployment to GitHub; production ones say "Production".
  deployment_status:
  # A backstop for a deploy whose event was missed, or a break that comes later.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Another URL to check as well as https://babyvom.it
        required: false
  # Changes to the check itself run it against production first.
  pull_request:
    paths:
      - 'smoke/**'
      - '.github/workflows/after-deploy-smoke.yml'

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Smoke check babyvom.it
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: smoke
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: smoke/package-lock.json
      - run: npm ci --prefix smoke --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('./smoke/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The runner image already has Chrome's system libraries, so a cache hit needs nothing more.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: smoke/node_modules/.bin/playwright install --with-deps --only-shell chromium
      # The deployment's own URL is checked too when it isn't behind Vercel
      # Authentication (today it is, so the script notes it and skips it).
      - name: Smoke check
        env:
          EXTRA_URL: ${{ github.event.deployment_status.target_url || inputs.url }}
        run: node smoke/smoke.mjs --url https://babyvom.it ${EXTRA_URL:+--url "$EXTRA_URL"} --out smoke-results
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: smoke-results
          retention-days: 14
      - name: Open or update the failure issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='babyvom.it smoke check is failing'
          body="$( [ -f smoke-results/summary.md ] && cat smoke-results/summary.md || echo 'The check did not finish.')

          Run: $RUN (screenshots and console log in its artifact)"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee kevinmcalear; fi
      - name: Close the failure issue
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search '"babyvom.it smoke check is failing" in:title' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Passing again: $RUN"; fi
