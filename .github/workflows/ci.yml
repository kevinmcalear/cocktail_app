name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which of the slow jobs this change needs. Most PRs touch only
  # app code, and the database job (20+ minutes, a full Supabase stack) has
  # nothing to test for them. A skipped job counts as passing for a required
  # check, so the jobs below run whenever this one fails or is unsure.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.areas.outputs.database }}
      functions: ${{ steps.areas.outputs.functions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (first push, force push): run everything.
          if ! files=$(git diff --name-only "$BASE...HEAD" 2>/dev/null) || [ -z "$BASE" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
            echo "functions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          # App files the security tests read or import (../../lib/x.ts and
          # the like), so a test that starts reading one is covered here too.
          deps=$(grep -ohE "\.\./\.\./[A-Za-z0-9_./-]+\.[a-z]+" supabase/tests/*.mjs | sed 's|^\.\./\.\./||' | sort -u || true)
          db=false
          while IFS= read -r f; do
            case "$f" in
              supabase/*|scripts/check-local-migrations.mjs|package.json|package-lock.json|.github/workflows/ci.yml) db=true ;;
            esac
            if [ -n "$f" ] && printf '%s\n' "$deps" | grep -qxF "$f"; then db=true; fi
          done <<< "$files"
          fn=false
          if printf '%s\n' "$files" | grep -qE '^(supabase/functions/|\.github/workflows/ci\.yml$)'; then fn=true; fi
          echo "database=$db" >> "$GITHUB_OUTPUT"
          echo "functions=$fn" >> "$GITHUB_OUTPUT"
          echo "database=$db functions=$fn"

  app:
    name: Typecheck, lint, unit tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Each migration this PR adds must sort after main's latest, or
      # production's deploy refuses it after merge.
      - run: git fetch --no-tags --depth=1 origin main
      - run: node scripts/migration-order.mjs origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:design
      - run: npm run test:unit
      - run: npm run build:web

  database:
    name: Migrations and security tests
    runs-on: ubuntu-latest
    # Rebuilding the database now replays several large catalog data
    # migrations; busy runs passed 20 minutes and were cut off mid-suite.
    # The Australian catalog loads (Oct 14) pushed busy runs past 30 too:
    # quiet runs take 19 to 24 minutes, runs beside other PRs hit the limit.
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.database == 'true') }}
    # Supabase's images come from public.ecr.aws by default, which rate limits
    # anonymous pulls ("toomanyrequests: Rate exceeded") when several PRs run
    # at once. The same images are on GitHub's registry, where this job's own
    # token logs in: no secret to manage.
    permissions:
      contents: read
      packages: read
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      # Applies every migration to a fresh database, so a migration that
      # cannot rebuild the schema fails here.
      # The edge runtime serves image-worker, the generators and image-palette
      # for the image tests; on a local stack the image model is always mocked.
      - run: supabase start -x studio,imgproxy,logflare,vector,realtime,supavisor,mailpit,postgres-meta
      - run: supabase db lint --level warning --fail-on error
      - run: npm run test:security

  edge-functions:
    name: Edge functions typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.functions == 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Resolve npm: imports from Deno's cache like the edge runtime does,
      # rather than the app's node_modules (which this job doesn't install).
      # Run inside supabase/functions so Deno stops at that folder's deno.json
      # and does not try to install the app's package.json (expo 58 is newer
      # than Deno's minimum dependency age).
      - run: deno check --node-modules-dir=none */index.ts
        working-directory: supabase/functions
