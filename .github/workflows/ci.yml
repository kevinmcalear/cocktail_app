name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, unit tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Each migration this PR adds must sort after main's latest, or
      # production's deploy refuses it after merge.
      - run: git fetch --no-tags --depth=1 origin main
      - run: node scripts/migration-order.mjs origin/main
      # The migrations this PR adds or changes: no DRAFT headers, no writes
      # granted to anon or public, RLS on every new public table.
      - run: node scripts/migration-rules.mjs origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:design
      - run: npm run test:unit
      - run: npm run build:web

  # A PR that changes nothing the database job reads skips it
  # (scripts/database-ci.mjs). On a pull_request the checkout is GitHub's merge
  # commit, so HEAD^1 is the base branch and the diff is just this PR.
  changes:
    name: Database job needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.check.outputs.database }}
      functions: ${{ steps.check.outputs.functions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$files" | node scripts/database-ci.mjs >> "$GITHUB_OUTPUT"
            if printf '%s\n' "$files" | grep -qE '^(supabase/functions/|\.github/workflows/ci\.yml$)'; then
              echo functions=true >> "$GITHUB_OUTPUT"
            else
              echo functions=false >> "$GITHUB_OUTPUT"
            fi
          else
            echo database=true >> "$GITHUB_OUTPUT"
            echo functions=true >> "$GITHUB_OUTPUT"
          fi

  # The security suite runs in parallel shards, each on its own runner with
  # its own stack (scripts/security-shard.mjs splits the files by measured
  # time). Every shard rebuilds the database from every migration, so a
  # migration that cannot rebuild the schema fails in each.
  security-shard:
    name: Security tests (${{ matrix.shard }}/3)
    needs: changes
    # Skip only on an explicit "no": if the changes job fails, this still runs.
    # Pushes to main always run it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.database != 'false') }}
    runs-on: ubuntu-latest
    # A shard's tests take 2 to 7 minutes after a 4 to 14 minute rebuild
    # (runners vary up to threefold). test:security passes --test-force-exit,
    # so an open database handle fails the file instead of holding the job.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Supabase's images come from public.ecr.aws by default, which rate limits
    # anonymous pulls ("toomanyrequests: Rate exceeded") when several PRs run
    # at once. The same images are on GitHub's registry, where this job's own
    # token logs in: no secret to manage.
    permissions:
      contents: read
      packages: read
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_CLI: 2.112.0
      SUPABASE_EXCLUDE: studio,imgproxy,logflare,vector,realtime,supavisor,mailpit,postgres-meta
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Pinned: the types drift check below needs the same CLI as npm run
      # gen:types (each version prints the file differently). Bump both together.
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      # A PR starts from the database main last built (the database-snapshot
      # job) and applies only its own new migrations, when scripts/db-snapshot.mjs
      # says a fresh replay would build the same database. Otherwise, and
      # always on main, every migration replays from scratch.
      # One snapshot per CLI, config, seed and set of migrations.
      - id: key
        run: echo "prefix=supabase-db-$RUNNER_ARCH-$SUPABASE_CLI-${{ hashFiles('supabase/config.toml', 'supabase/seed.sql') }}-" >> "$GITHUB_OUTPUT"
      - id: snapshot
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/db-snapshot
          key: ${{ steps.key.outputs.prefix }}${{ hashFiles('supabase/migrations/**') }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - id: reuse
        if: steps.snapshot.outputs.cache-matched-key != ''
        run: |
          if node scripts/db-snapshot.mjs check "$RUNNER_TEMP/db-snapshot/migrations.sha256"; then
            docker volume create supabase_db_cocktail_app
            sudo tar --numeric-owner -C /var/lib/docker/volumes/supabase_db_cocktail_app/_data -xf "$RUNNER_TEMP/db-snapshot/db.tar"
            echo ok=true >> "$GITHUB_OUTPUT"
          fi
      # With main's database in place, start skips the migrations and the seed.
      # The edge runtime serves image-worker, the generators and image-palette
      # for the image tests; on a local stack the image model is always mocked.
      # Supabase's images (about ten) come from the Actions cache when a run
      # has saved them for this CLI and config, so shards don't all pull them
      # from ghcr.io at once (27 Oct: "toomanyrequests" failed every database
      # job). Shard 3 saves them after the types check, so postgres-meta
      # (which gen types starts on its own) is in the copy too.
      - id: images
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/supabase-images
          key: supabase-images-v2-${{ runner.arch }}-${{ env.SUPABASE_CLI }}-${{ hashFiles('supabase/config.toml') }}
          # An older or partial copy still saves most of the pulls.
          restore-keys: |
            supabase-images-v2-${{ runner.arch }}-${{ env.SUPABASE_CLI }}-
            supabase-images-${{ runner.arch }}-${{ env.SUPABASE_CLI }}-
      - if: steps.images.outputs.cache-matched-key != ''
        run: docker load -i "$RUNNER_TEMP/supabase-images/images.tar"
      - run: bash scripts/ci-supabase-start.sh
      - if: steps.reuse.outputs.ok == 'true'
        run: supabase migration up --local
      # types/database.ts is generated from the schema: regenerate it from the
      # database just built and fail if the committed copy differs. Same command
      # as npm run gen:types, with the CLI installed above (no npx download).
      # Once is enough: shard 3 holds the quick files, off the critical path.
      - name: Generated database types match the migrations
        if: matrix.shard == 3
        # Starts postgres-meta, which isn't in the image cache until shard 3
        # saves it. On 27 Oct ghcr.io refused bursts ("toomanyrequests") and
        # public.ecr.aws hit its anonymous data limit, so this tries six times
        # over about five minutes, alternating the two (as start does).
        run: |
          for try in 1 2 3 4 5 6; do
            if [ $((try % 2)) = 1 ]; then registry=ghcr.io; else registry=public.ecr.aws; fi
            SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry supabase gen types typescript --local --schema public > types/database.ts && break
            [ "$try" = 6 ] && exit 1
            echo "gen types failed on $registry (try $try of 6), trying again in $((try * 20))s"
            sleep $((try * 20))
          done
          git diff --exit-code -- types/database.ts || {
            echo "::error file=types/database.ts::Out of date with supabase/migrations. Run npm run gen:types against a local stack built from this branch's migrations and commit the result."
            exit 1
          }
      - if: steps.images.outputs.cache-hit != 'true' && matrix.shard == 3
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-images"
          docker save -o "$RUNNER_TEMP/supabase-images/images.tar" $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '/supabase/' | sort -u)
      - if: steps.images.outputs.cache-hit != 'true' && matrix.shard == 3
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/supabase-images
          key: supabase-images-v2-${{ runner.arch }}-${{ env.SUPABASE_CLI }}-${{ hashFiles('supabase/config.toml') }}
      - run: supabase db lint --level warning --fail-on error
      - run: npm run test:security
        timeout-minutes: 20
        env:
          SECURITY_SHARD: ${{ matrix.shard }}/3

  # Builds the database from every migration on each push to main and saves
  # it for PRs (see the shards' reuse step). Not a required check: if it fails
  # or is missing, PRs replay from scratch. One copy per set of migrations.
  database-snapshot:
    name: Database snapshot for PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_CLI: 2.112.0
      SUPABASE_EXCLUDE: studio,imgproxy,logflare,vector,realtime,supavisor,mailpit,postgres-meta
    steps:
      - uses: actions/checkout@v7
      # One snapshot per CLI, config, seed and set of migrations.
      - id: key
        run: echo "prefix=supabase-db-$RUNNER_ARCH-$SUPABASE_CLI-${{ hashFiles('supabase/config.toml', 'supabase/seed.sql') }}-" >> "$GITHUB_OUTPUT"
      - id: saved
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/db-snapshot
          key: ${{ steps.key.outputs.prefix }}${{ hashFiles('supabase/migrations/**') }}
          lookup-only: true
      - if: steps.saved.outputs.cache-hit != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI }}
      - if: steps.saved.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Stopped (keeping its volume) so the copy is of a shut-down database.
      - if: steps.saved.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci-supabase-start.sh
          supabase stop
          mkdir -p "$RUNNER_TEMP/db-snapshot"
          node scripts/db-snapshot.mjs list > "$RUNNER_TEMP/db-snapshot/migrations.sha256"
          sudo tar --numeric-owner -C /var/lib/docker/volumes/supabase_db_cocktail_app/_data -cf "$RUNNER_TEMP/db-snapshot/db.tar" .
          sudo chown "$USER" "$RUNNER_TEMP/db-snapshot/db.tar"
          ls -lh "$RUNNER_TEMP/db-snapshot"
      - if: steps.saved.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/db-snapshot
          key: ${{ steps.key.outputs.prefix }}${{ hashFiles('supabase/migrations/**') }}

  # The required check. It passes only when every shard passed, so a failed,
  # cancelled or timed-out shard fails it. always() keeps it from being
  # skipped (a skipped job passes a required check) when the run is cancelled;
  # it skips only on the explicit "no database changes" path.
  database:
    name: Migrations and security tests
    needs: [changes, security-shard]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.database != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.security-shard.result != 'success'
        run: |
          echo "Security shards: ${{ needs.security-shard.result }}"
          exit 1
      - run: echo "Every security shard passed."

  edge-functions:
    name: Edge functions typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.functions == 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Resolve npm: imports from Deno's cache like the edge runtime does,
      # rather than the app's node_modules (which this job doesn't install).
      # Run inside supabase/functions so Deno stops at that folder's deno.json
      # and does not try to install the app's package.json (expo 58 is newer
      # than Deno's minimum dependency age).
      - run: deno check --node-modules-dir=none */index.ts
        working-directory: supabase/functions
