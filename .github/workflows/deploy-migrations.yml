name: Deploy migrations

# Applies supabase/migrations to the production project after a migration
# lands on main. Merging a migration already needs Kevin's human-approved
# label (change-policy), so that label is the production OK. Run it by hand
# (workflow_dispatch) to catch production up when it is behind.
#
# Needs three repository secrets: SUPABASE_ACCESS_TOKEN (a personal access
# token from the Supabase dashboard), SUPABASE_PROJECT_ID (the project ref)
# and SUPABASE_DB_PASSWORD (the database password). Edge functions are not
# deployed here; that stays a separate, human-gated step.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check the secrets are set
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Names the culprit before linking: a token scoped to the wrong
      # organisation or project lists nothing here, and a wrong project ref
      # fails the shape check. Neither prints the secret.
      - name: Check the token sees the project
        run: |
          echo "Projects this token can see:"
          supabase projects list
          if ! printf '%s' "$SUPABASE_PROJECT_ID" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_ID should be the 20-letter project ref from Project Settings > General (got ${#SUPABASE_PROJECT_ID} characters)."
            exit 1
          fi
          if ! supabase projects list -o json | grep -q "\"$SUPABASE_PROJECT_ID\""; then
            echo "::error::The access token cannot see project $SUPABASE_PROJECT_ID. Scope the token to the organisation and project that own it."
            exit 1
          fi
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - run: supabase migration list --linked
      - run: supabase db push
      - run: supabase migration list --linked
