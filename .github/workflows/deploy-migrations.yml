name: Deploy migrations

# Applies supabase/migrations to the production project after a migration
# lands on main. Merging a migration already needs Kevin's human-approved
# label (change-policy), so that label is the production OK. Run it by hand
# (workflow_dispatch) to catch production up when it is behind.
#
# Talks to the database directly through Supabase's session pooler, so it
# needs two repository secrets: SUPABASE_PROJECT_ID (the project ref) and
# SUPABASE_DB_PASSWORD (the database password). No access token: the
# management API is not involved. Edge functions are not deployed here; that
# stays a separate, human-gated step.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check the secrets are set
        run: |
          for name in SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          if ! printf '%s' "$SUPABASE_PROJECT_ID" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_ID should be the 20-letter project ref from Project Settings > General (got ${#SUPABASE_PROJECT_ID} characters)."
            exit 1
          fi
      # Diagnostic only (branch run): is the project live, does its direct
      # host resolve over IPv4, and what does the management API say about
      # it and its pooler. Prints hostnames and status codes, never a key.
      - name: Diagnose the connection
        run: |
          ref="$SUPABASE_PROJECT_ID"
          echo "REST endpoint status: $(curl -sS -o /dev/null -w '%{http_code}' "https://$ref.supabase.co/rest/v1/" || echo unreachable)"
          echo "Direct host addresses:"; getent ahosts "db.$ref.supabase.co" || echo "  none"
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            for path in "" "/config/database/pooler" "/postgrest" "/config/database/postgres"; do
              code=$(curl -sS -o resp.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$ref$path" || echo unreachable)
              echo "GET /v1/projects/{ref}$path -> $code"
              jq -r 'if type=="array" then (map(.db_host // empty) | unique | map("  db_host=" + .) | .[]) elif has("status") then "  status=\(.status) region=\(.region // "")" elif has("message") then "  message=\(.message)" else "  keys: " + (keys|join(",")) end' resp.json 2>/dev/null || true
              rm -f resp.json
            done
          else
            echo "No SUPABASE_ACCESS_TOKEN secret; skipping the management API."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The project is in us-east-2. Which pooler cluster it sits on is only
      # shown in the dashboard, so try each: the wrong cluster answers
      # "Tenant or user not found", a wrong password fails on all of them.
      # The URL carries the password, so it is masked before any use.
      - name: Find the database
        run: |
          password=$(jq -rn --arg v "$SUPABASE_DB_PASSWORD" '$v|@uri')
          echo "::add-mask::$password"
          for host in "db.$SUPABASE_PROJECT_ID.supabase.co" aws-1-us-east-2.pooler.supabase.com aws-0-us-east-2.pooler.supabase.com aws-2-us-east-2.pooler.supabase.com aws-3-us-east-2.pooler.supabase.com aws-0-us-east-1.pooler.supabase.com aws-1-us-east-1.pooler.supabase.com; do
            case "$host" in db.*) user=postgres;; *) user="postgres.$SUPABASE_PROJECT_ID";; esac
            url="postgresql://$user:$password@$host:5432/postgres"
            echo "::add-mask::$url"
            if out=$(psql "$url" -Atc 'select 1' 2>&1); then
              echo "Connected through $host"
              echo "DB_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "$host: $out"
          done
          echo "::error::Could not connect to the database. 'Tenant or user not found' on every cluster means the project is on another one; 'password authentication failed' means SUPABASE_DB_PASSWORD is wrong (reset it under Project Settings > Database)."
          exit 1
      - run: supabase migration list --db-url "$DB_URL"
      - run: supabase db push --db-url "$DB_URL"
      - run: supabase migration list --db-url "$DB_URL"
