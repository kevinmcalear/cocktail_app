name: Deploy migrations

# Applies supabase/migrations to the production project after a migration
# lands on main. Merging a migration already needs Kevin's human-approved
# label (change-policy), so that label is the production OK. Run it by hand
# (workflow_dispatch) to catch production up when it is behind.
#
# Talks to the database directly through Supabase's session pooler, so it
# needs one repository secret, SUPABASE_DB_PASSWORD (the database password).
# The project ref is public (it is the hostname every client calls) and
# lives in PROJECT_REF below. No access token: the management API is not
# involved. Edge functions are not deployed here; that stays a separate,
# human-gated step.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

env:
  PROJECT_REF: uzrqriixgxbvhunwrwkn

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check the secret is set
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Repository secret SUPABASE_DB_PASSWORD is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      # The project is in us-east-2. Which pooler cluster it sits on is only
      # shown in the dashboard, so try each: the wrong cluster answers
      # "tenant/user not found", a wrong password fails on all of them. The
      # direct host comes first in case the project has an IPv4 address.
      # The URL carries the password, so it is masked before any use.
      - name: Find the database
        run: |
          password=$(jq -rn --arg v "$SUPABASE_DB_PASSWORD" '$v|@uri')
          echo "::add-mask::$password"
          for host in "db.$PROJECT_REF.supabase.co" aws-1-us-east-2.pooler.supabase.com aws-0-us-east-2.pooler.supabase.com; do
            case "$host" in db.*) user=postgres;; *) user="postgres.$PROJECT_REF";; esac
            url="postgresql://$user:$password@$host:5432/postgres"
            echo "::add-mask::$url"
            if out=$(psql "$url" -Atc 'select 1' 2>&1); then
              echo "Connected through $host"
              echo "DB_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "$host: $out"
          done
          echo "::error::Could not connect to the database. 'tenant/user not found' on every host means the project is on another cluster; 'password authentication failed' means SUPABASE_DB_PASSWORD is wrong (reset it under Project Settings > Database)."
          exit 1
      - run: supabase migration list --db-url "$DB_URL"
      - run: supabase db push --db-url "$DB_URL"
      - run: supabase migration list --db-url "$DB_URL"
