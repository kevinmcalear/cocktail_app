name: Jest

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: jest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:jest -- --ci
