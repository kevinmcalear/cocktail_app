# Drinks: open a drink from the venue's Drinks list, close it, and land back on the list.
appId: com.kevinmcalear.cocktail.dev
name: Open a drink and go back
---
- runFlow: subflows/start.yaml
- tapOn: "Drinks"
# Each Drinks row reads "<name>, <line>, open" (DrinkListRow in components/screens/drinks/DrinksParts.tsx).
- tapOn:
    text: ".*, open"
    index: 0
# The drink page's Close (components/screens/drink/DrinkControls.tsx).
- assertVisible: "Close"
- tapOn: "Close"
- assertVisible:
    text: "Drinks"
    selected: true
- assertVisible: ".*, open"
