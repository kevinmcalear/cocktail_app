[package]
name = "cocktail-desktop"
version = "0.1.0"
description = "Desktop shell for the Cocktail web app"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "cocktail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# generate_context! emits serde_json for the plugin config.
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Must be registered first; with `deep-link`, a link that launches a second
# instance on Windows/Linux is forwarded to the running one.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
