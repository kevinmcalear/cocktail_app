plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.subjectcutout'
version = '1.0.0'

android {
  namespace "expo.modules.subjectcutout"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The model is unbundled: Google Play services downloads it on first use (SubjectCutoutModule asks).
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  implementation "androidx.exifinterface:exifinterface:1.4.1"
}
